name: DePara REBORN browser checks
on:
  push:
    branches: [main]
    paths:
      - 'reborn-preview/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/reborn-browser-tests.yml'
  workflow_dispatch:
concurrency:
  group: depara-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/depara-server.log 2>&1 &
          sleep 2
      - name: Run iPhone-sized browser tests
        run: npx playwright test tests/reborn.spec.cjs --config=playwright.config.cjs --reporter=line --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depara-browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
