name: Deploy REBORN Preview (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depara-reborn-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated REBORN branch
        uses: actions/checkout@v4
        with:
          ref: depara-reborn-2
          persist-credentials: false

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Verify preview D1 ID
        env:
          PREVIEW_D1_ID: ${{ secrets.CLOUDFLARE_PREVIEW_D1_DATABASE_ID }}
        run: |
          if ! [[ "$PREVIEW_D1_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Missing or invalid CLOUDFLARE_PREVIEW_D1_DATABASE_ID"
            exit 1
          fi

      - name: Configure isolated preview database
        env:
          PREVIEW_D1_ID: ${{ secrets.CLOUDFLARE_PREVIEW_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("wrangler.preview.toml")
          original = p.read_text()
          placeholder = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"
          assert original.count(placeholder) == 1
          p.write_text(original.replace(placeholder, os.environ["PREVIEW_D1_ID"]))
          PY

      - name: Deploy only depara-api-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.preview.toml
