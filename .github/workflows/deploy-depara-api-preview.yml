name: Deploy DePara API Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-depara-api-preview.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: depara-api-preview-deploy
  cancel-in-progress: false
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: depara-preview
    steps:
      - name: Checkout isolated preview source
        uses: actions/checkout@v4
        with:
          ref: preview-r2-silent-share-20261021
          persist-credentials: false
      - name: Validate test Worker and app
        run: |
          node --input-type=module --check < cloudflare/preview/worker.js
          node --check reborn-preview/app.js
      - name: Guard against production deployment
        run: |
          grep -Fxq 'name = "depara-api-preview"' cloudflare/preview/wrangler.toml
          grep -Fxq 'database_name = "depara-preview-db"' cloudflare/preview/wrangler.toml
          grep -Fxq 'database_id = "c1602af7-3219-4d14-87af-8515c40193be"' cloudflare/preview/wrangler.toml
      - name: Explain Cloudflare R2 prerequisite
        run: |
          echo "R2 must be enabled in Cloudflare Dashboard before the bucket can be created."
          echo "If Cloudflare returns code 10042, enable R2 on the account and rerun this workflow."
      - name: Create preview-only R2 bucket if missing
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: r2 bucket create depara-preview-share-images
        continue-on-error: true
      - name: Verify preview R2 bucket
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: r2 bucket info depara-preview-share-images
      - name: Deploy preview Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config cloudflare/preview/wrangler.toml

      - name: Report failed preview deployment automatically
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const body = 'Preview deployment failed. Run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId + '\nCommit: ' + context.sha;
            await github.rest.issues.create({owner, repo, title: 'Preview deploy failed (run ' + context.runId + ')', body});
