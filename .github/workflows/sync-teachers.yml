name: Sync VNAU teachers
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sync-vnau-teachers
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/sync_teachers.py --batch 20
      - name: Commit results
        if: always()
        run: |
          if [ -d data/teachers ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/teachers
            if ! git diff --cached --quiet; then
              git commit -m 'Update VNAU teacher catalog and schedules'
              git push
            fi
          fi
