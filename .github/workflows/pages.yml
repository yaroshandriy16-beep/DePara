name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public test API origin; this is not a token or secret.
          VITE_VNAU_API_ORIGIN: https://depara-vnau-test.yaroshandriy16.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear the previous stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/e219e340607e31235dea087ef7eba47d8663bce9/cancel" >/dev/null; then
            echo "Requested cancellation of the stalled deployment."
          else
            echo "The cancellation request was not accepted; continuing to check Pages."
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Allow more time if GitHub Pages is processing a deployment slowly.
          timeout: 1200000
