name: Update VNAU free classrooms

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,10,16,22 * * *'

permissions:
  contents: write

concurrency:
  group: update-free-classrooms
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Download classroom snapshots (3 days, pairs 1-6)
        run: python scripts/fetch_room_calendar.py --days 3 --pairs 6
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/campus/index.json data/campus/snapshots/
          if git diff --cached --quiet; then
            echo 'No updates'
          else
            git commit -m 'Update classroom snapshots by date and pair'
            git push
          fi
