name: Release DePara Production Worker (explicit trigger)
on:
  push:
    branches: [main]
    paths:
      - '.github/depara-production-release.txt'
permissions:
  contents: read
concurrency:
  group: depara-production-worker-release
  cancel-in-progress: false
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed production source
        uses: actions/checkout@v4
        with:
          ref: cloudflare-worker-setup
          persist-credentials: false
      - name: Check production Worker syntax
        run: node --input-type=module --check < cloudflare/production/worker.js
      - name: Guard production identity
        run: |
          grep -Fxq 'name = "depara-api"' cloudflare/production/wrangler.toml
          grep -Fxq 'database_name = "depara-db"' cloudflare/production/wrangler.toml
          grep -Fxq 'database_id = "6beccbd7-053f-491b-8d8a-77f2179c1041"' cloudflare/production/wrangler.toml
          grep -q '/api/share/prepare' cloudflare/production/worker.js
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config cloudflare/production/wrangler.toml
