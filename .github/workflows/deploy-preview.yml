name: Deploy DePara Preview API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depara-preview-api
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: depara-preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify reviewed preview source exists
        shell: bash
        run: |
          test -s backend/src/preview-worker.js || {
            echo "::error::Reviewed preview Worker source is not committed. Deployment blocked."
            exit 1
          }
          grep -q 'name = "depara-api-preview"' backend/wrangler.preview.toml
          grep -q 'database_name = "depara-preview-db"' backend/wrangler.preview.toml
          grep -q 'main = "src/preview-worker.js"' backend/wrangler.preview.toml
      - name: Validate preview Worker syntax and protected routes
        shell: bash
        run: |
          node --check backend/src/preview-worker.js
          grep -q 'savePreparedInlineMessage' backend/src/preview-worker.js
          grep -q 'sendPhoto' backend/src/preview-worker.js
          grep -q 'DePara_Reborn_Test_Bot' backend/src/preview-worker.js
          grep -q 'path === "/api/share/prepare"' backend/src/preview-worker.js
          grep -q 'path === "/api/social/inbox"' backend/src/preview-worker.js
      - name: Deploy preview Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --config wrangler.preview.toml
      - name: Smoke test preview health and bindings
        shell: bash
        run: |
          set -euo pipefail
          url="https://depara-api-preview.yaroshandriy16.workers.dev/health"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$url" -o /tmp/depara-health.json; then
              if node -e 'const h=require("/tmp/depara-health.json"); if(h.ok!==true || h.database!==true || h.telegramConfigured!==true) process.exit(1)'; then
                echo "Preview health, D1 binding and Telegram secret are present."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Preview health check failed after deployment."
          exit 1
