
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#071b19">

  <title>ДеПара? — Твій розклад. Твій день.</title>

  <link rel="stylesheet" href="style.css?v=7">
</head>

<body>
  <div class="ambient"></div>
  <div class="splash" id="splash" aria-label="Завантаження ДеПара?"><div class="splash-mark">ДП<span>?</span></div><div class="splash-title">ДеПара<span>?</span></div><p>Твій розклад. Твій день.</p><div class="splash-line"></div></div>

  <div class="app">
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true">ДП<span>?</span></span>

        <div>
          <b>ДеПара<span class="gold">?</span></b>
          <small>Твій розклад. Твій день.</small>
        </div>
      </div>

      <div class="header-right">
        <span class="status" id="connection">● Онлайн</span>

        <button
          class="icon-btn"
          id="theme"
          title="Змінити тему"
        >☼</button>
      </div>
    </header>

    <main id="screen"></main>

    <nav id="nav">
      <button data-page="today" class="active">
        <span>◉</span>Мій день
      </button>

      <button data-page="schedule">
        <span>▦</span>Розклад
      </button>

      <button data-page="study">
        <span>✎</span>Простір
      </button>

      <button data-page="social">
        <span>♧</span>Спільнота
      </button>

      <button data-page="profile">
        <span>◇</span>Профіль
      </button>
    </nav>
  </div>

  <div id="toast" role="status"></div>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Основний застосунок -->
  <script src="app.js?v=7"></script>

  <script>window.addEventListener('load',()=>{setTimeout(()=>document.getElementById('splash')?.classList.add('splash-hide'),400);setTimeout(()=>document.getElementById('splash')?.remove(),900)});setTimeout(()=>document.getElementById('splash')?.remove(),3500);</script>

  <!-- Друзі та чати -->
  <script src="social.js?v=1"></script>
</body>
</html>
