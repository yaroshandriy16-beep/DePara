<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1410"><title>ДеПара? · Зошит 2.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9f4ec;background:#0b1410;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(85px + env(safe-area-inset-bottom))}button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:680px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;padding:7px 0 17px}header strong{font-size:21px}header small{display:block;color:#8ea79a;margin-top:3px;font-size:12px}.gold{color:#d5b56c}.badge{border:1px solid #6b5b36;color:#d5b56c;border-radius:20px;padding:6px 9px;font-size:10px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#17281e;padding:4px;border-radius:15px;margin:9px 0 20px}.tabs button{border:0;border-radius:11px;background:none;color:#a4b9ab;font-size:12px;padding:13px 2px}.tabs .active{background:#bce5c8;color:#123420;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading{font-size:23px;font-weight:750;margin:0 0 4px}.muted{color:#95a99c;font-size:13px;line-height:1.5}.card{background:#16281d;border:1px solid #294734;border-radius:17px;padding:15px;margin:11px 0}.btn{border:0;border-radius:12px;background:#bce5c8;color:#123420;font-weight:700;padding:11px 14px}.ghost{background:#243c2b;color:#e6f4e9}.tiny{font-size:12px;padding:8px 10px}.field{display:block;width:100%;border:1px solid #375743;background:#0d1c13;border-radius:12px;color:#f2fff4;padding:12px;margin:7px 0 13px;outline-color:#a9d8b7}.label{font-size:12px;color:#aec4b2}textarea{min-height:220px;resize:vertical;line-height:1.55}.entry{display:block;width:100%;text-align:left;background:#192f22;border:1px solid #2b4c35;border-radius:15px;padding:14px;color:inherit;margin:9px 0}.entry b{display:block;margin-bottom:5px}.entry small{color:#9db7a4}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{background:#213b2a;color:#bce5c8;border:1px solid #355640;border-radius:22px;padding:8px 12px;font-size:12px}.chip.active{background:#bce5c8;color:#123420}.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tools button{background:#264431;color:white;border:0;border-radius:9px;padding:8px 11px}.empty{text-align:center;padding:38px 16px;border:1px dashed #36523d;border-radius:18px;color:#9ab19f;margin:20px 0}.empty b{display:block;color:#d9efdf;margin-bottom:8px}.back{background:none;border:0;color:#bce5c8;padding:9px 0}.status{color:#a5cbb0;font-size:12px;min-height:19px}.preview{max-width:100%;max-height:200px;border-radius:10px;display:block;margin:8px 0}.warn{color:#e1be75;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#0c1510;border-top:1px solid #2b4333;text-align:center;padding:12px 0 calc(12px + env(safe-area-inset-bottom));font-size:11px;color:#a6b9a9}h3{margin:5px 0 13px;font-size:17px}
</style></head><body><main><header><div><strong>ДеПара<span class="gold">?</span></strong><small>Зошит · окремий тест</small></div><span class="badge">REBORN PREVIEW</span></header><div class="tabs"><button data-tab="notes" class="active">Конспекти</button><button data-tab="chats">Чати</button><button data-tab="friends">Друзі</button><button data-tab="journal">Журнал</button></div><div id="view"></div></main><nav>Тестова версія · основний застосунок без змін</nav><script>
(()=>{'use strict';const KEY='depara-notes-v2-stage1';const $=s=>document.querySelector(s);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let notes=[];try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}let tab='notes',editing=null,filter='',search='';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch(e){alert('Не вдалося зберегти. Можливо, закінчилась пам’ять браузера.');return false}};const getSubjects=()=>[...new Set(notes.map(n=>n.subject).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'uk'));function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab!=='notes'){const name={chats:'Чати',friends:'Друзі',journal:'Журнал'}[tab];$('#view').innerHTML='<h1 class="heading">'+name+'</h1><div class="empty"><b>'+name+'</b>Розділ поки порожній. Реальні функції додамо на наступних етапах.</div>';return}if(editing!==null){editor();return}const subjects=getSubjects();let shown=notes.filter(n=>(!filter||n.subject===filter)&&(!search||(n.title+' '+n.body+' '+n.subject).toLocaleLowerCase('uk').includes(search.toLocaleLowerCase('uk'))));shown.sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(b.updated-a.updated));$('#view').innerHTML='<div class="row"><div><h1 class="heading">Конспекти</h1><div class="muted">'+notes.length+' записів · збережено на цьому пристрої</div></div><button id="add" class="btn">+ Створити</button></div><input id="search" class="field" placeholder="Пошук конспектів..." value="'+escape(search)+'"><div class="chips"><button class="chip '+(!filter?'active':'')+'" data-subject="">Усі</button>'+subjects.map(s=>'<button class="chip '+(filter===s?'active':'')+'" data-subject="'+escape(s)+'">'+escape(s)+'</button>').join('')+'</div>'+(!shown.length?'<div class="empty"><b>Тут поки немає конспектів</b>Створи перший запис або зміни фільтр.</div>':shown.map(n=>'<button class="entry" data-open="'+escape(n.id)+'"><b>'+(n.pinned?'📌 ':'')+escape(n.title||'Без назви')+(n.favorite?' ★':'')+'</b><small>'+escape(n.subject||'Без предмета')+' · '+new Date(n.updated).toLocaleDateString('uk-UA')+'</small><div class="muted">'+escape(n.body.slice(0,115))+'</div></button>').join(''));$('#add').onclick=()=>{editing='new';render()};$('#search').oninput=e=>{const p=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(p,p)};document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{filter=b.dataset.subject;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{editing=b.dataset.open;render()})}
function editor(){const n=notes.find(x=>x.id===editing)||{title:'',subject:'',body:'',homework:'',pinned:false,favorite:false};$('#view').innerHTML='<button class="back" id="back">← Конспекти</button><h1 class="heading">'+(editing==='new'?'Новий конспект':'Редагувати конспект')+'</h1><div class="muted">Автозбереження чернетки під час редагування</div><label class="label">Назва</label><input class="field" id="title" placeholder="Назва лекції" value="'+escape(n.title)+'"><label class="label">Предмет</label><input class="field" id="subject" list="subjects" placeholder="Введи предмет" value="'+escape(n.subject)+'"><datalist id="subjects">'+getSubjects().map(s=>'<option value="'+escape(s)+'">').join('')+'</datalist><label class="label">Текст конспекту</label><div class="tools"><button data-format="bold">**Ж**</button><button data-format="italic">*К*</button><button data-format="underline"><u>П</u></button><button data-format="heading">H2</button><button data-format="list">• Список</button></div><textarea class="field" id="body" placeholder="Пиши конспект...">'+escape(n.body)+'</textarea><label class="label">Домашнє завдання</label><textarea class="field" style="min-height:85px" id="homework" placeholder="Що потрібно зробити?">'+escape(n.homework)+'</textarea><div class="chips"><label class="chip"><input type="checkbox" id="pinned" '+(n.pinned?'checked':'')+'> Закріпити</label><label class="chip"><input type="checkbox" id="favorite" '+(n.favorite?'checked':'')+'> ★ Обране</label></div><div class="row"><button class="btn" id="save">Зберегти</button><button class="btn ghost" id="cancel">Назад</button></div><div class="status" id="status"></div>'+(editing==='new'?'':'<div class="row" style="margin-top:15px"><button class="btn ghost tiny" id="duplicate">Дублювати</button><button class="btn ghost tiny" id="export">Експорт .txt</button><button class="btn tiny" style="background:#66332e;color:#fff" id="delete">Видалити</button></div>')+'<p class="warn">На цьому етапі дані зберігаються лише в браузері. Це ще не хмарна синхронізація. Форматування вставляє текстові позначки, не є візуальним редактором.</p>';const fields=['title','subject','body','homework','pinned','favorite'];let current=editing==='new'?{id:'n'+Date.now()+'-'+Math.random().toString(36).slice(2),created:Date.now()}:n;function persist(){fields.forEach(k=>current[k]=k==='pinned'||k==='favorite'?$('#'+k).checked:$('#'+k).value);current.updated=Date.now();const i=notes.findIndex(x=>x.id===current.id);if(i>=0)notes[i]=current;else notes.push(current);if(save())$('#status').textContent='Збережено · '+new Date().toLocaleTimeString('uk-UA');editing=current.id}let debounce;fields.forEach(k=>$('#'+k).addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(persist,600)}));$('#save').onclick=()=>{clearTimeout(debounce);persist();editing=null;render()};$('#back').onclick=$('#cancel').onclick=()=>{clearTimeout(debounce);if(fields.some(k=>(k==='pinned'||k==='favorite'?$('#'+k).checked:$('#'+k).value)!==(current[k]??(k==='pinned'||k==='favorite'?false:''))))persist();editing=null;render()};document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{const a=$('#body'),s=a.selectionStart,e=a.selectionEnd,v=a.value.slice(s,e)||'текст',type=b.dataset.format,fmt={bold:'**'+v+'**',italic:'*'+v+'*',underline:'__'+v+'__',heading:'\n## '+v+'\n',list:'\n- '+v}[type];a.setRangeText(fmt,s,e,'end');a.dispatchEvent(new Event('input'));a.focus()});if($('#delete'))$('#delete').onclick=()=>{if(confirm('Видалити цей конспект?')){notes=notes.filter(x=>x.id!==current.id);save();editing=null;render()}};if($('#duplicate'))$('#duplicate').onclick=()=>{persist();notes.push({...current,id:'n'+Date.now(),title:current.title+' (копія)',updated:Date.now()});save();editing=null;render()};if($('#export'))$('#export').onclick=()=>{persist();const blob=new Blob([current.title+'\n'+current.subject+'\n\n'+current.body+'\n\nДомашнє завдання:\n'+current.homework],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(current.title||'Конспект')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editing=null;render()});render()})();
</script></body></html>
