<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ДеПара? Зошит 2.0 — окремий тест</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090e0b;color:#edf7ef}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 100px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}main{max-width:650px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 18px;border-bottom:1px solid #315041}header b{font-size:25px}header small{display:block;color:#91ae9d;margin-top:4px}.tag{font-size:11px;color:#e6c37b;border:1px solid #776342;border-radius:18px;padding:7px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#173328;border-radius:16px;padding:5px;margin:20px 0}.tabs button{padding:13px 3px;background:transparent;color:#a8c5b2;border-radius:12px;font-size:12px}.tabs button.active{background:#c4f1d7;color:#133b29;font-weight:750}.card{background:#193729;border:1px solid #305b41;border-radius:20px;padding:16px;margin:13px 0}.muted{color:#9db5a4;font-size:13px;line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.primary{background:#b9eccd;color:#103924;padding:12px 16px;border-radius:12px;font-weight:750}.secondary{background:#294c38;color:#e7f5e9;padding:11px 13px;border-radius:12px}.danger{background:#4c2828;color:#ffd6d6;padding:10px 12px;border-radius:10px}.field{width:100%;background:#10271d;border:1px solid #42604e;color:#fff;border-radius:12px;padding:13px;margin:6px 0 11px;outline-color:#b9eccd}textarea{min-height:160px;resize:vertical}.item{padding:15px;background:#213d2d;border-radius:15px;margin:9px 0;overflow-wrap:anywhere}.item b{display:block;margin-bottom:5px}.item small{color:#a3bba9}.item button{margin-top:10px;margin-right:5px}.empty{text-align:center;padding:34px 15px;background:#173226;border-radius:20px;color:#a8c3ae}h1{font-size:25px;margin:16px 0 5px}h2{font-size:19px;margin:7px 0 12px}.back{background:transparent;color:#b8e9c9;padding:7px 0}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.toolbar button{background:#31553d;color:white;border-radius:9px;padding:8px 11px}.files{font-size:12px;color:#afc7b5}.status{padding:9px;border-radius:11px;background:#274934;color:#c9f2d8;font-size:12px}.pill{display:inline-block;padding:6px 9px;background:#30563e;border-radius:20px;margin:4px 4px 4px 0;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#0a0d0a;border-top:1px solid #77613c;display:flex;justify-content:center;padding:11px 12px calc(11px + env(safe-area-inset-bottom));z-index:2}nav span{font-size:12px;color:#d8bc7c}a{color:#b7e8c8} .hidden{display:none!important}
</style></head><body><main><header><div><b>ДеПара<span style="color:#e8c17b">?</span></b><small>Зошит 2.0 · чистий тест</small></div><span class="tag">TEST · без старих скриптів</span></header><h1 id="title">Зошит</h1><p class="muted" id="subtitle">Конспекти, чати, друзі та журнал</p><div class="tabs" id="tabs"><button data-tab="notes" class="active">Конспекти</button><button data-tab="chats">Чати</button><button data-tab="friends">Друзі</button><button data-tab="journal">Журнал</button></div><div id="view"></div></main><nav><span>ДеПара? · Зошит 2.0 · ізольований тест</span></nav>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem('depara_v2_'+k)||'[]');localStorage.setItem('depara_v2_'+k,JSON.stringify(v));return true}catch{return false}};let tab='notes',editor=-2,subject='',journalDate=new Date().toLocaleDateString('sv-SE'),editingJournal=-1;const group='ЕІ-23-1';const baseSubjects=['Аграрна політика та земельні відносини'];let subjects=[];const notes=()=>store('notes'),journal=()=>store('journal');const uniqueSubjects=()=>[...new Set([...subjects,...baseSubjects,...notes().map(n=>n.subject)])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'uk'));function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#title').textContent={notes:'Зошит',chats:'Чати',friends:'Друзі',journal:'Журнал'}[tab];$('#subtitle').textContent={notes:'Конспекти та предмети',chats:'Розмови з одногрупниками',friends:'Одногрупники',journal:'Відвідуваність та оцінки'}[tab];$('#tabs').classList.toggle('hidden',tab==='notes'&&editor!==-2);$('#view').innerHTML=tab==='notes'?renderNotes():tab==='journal'?renderJournal():tab==='friends'?renderFriends():renderChats()}
function renderNotes(){let a=notes();if(editor!==-2){let n=editor>=0?a[editor]:{};return '<button class="back" data-back>← До конспектів</button><h2>'+(editor>=0?'Редагувати конспект':'Новий конспект')+'</h2><form id="note-form"><label>Назва</label><input class="field" name="title" required maxlength="150" placeholder="Назва конспекту" value="'+esc(n.title||'')+'"><label>Предмет</label><input class="field" name="subject" required list="subject-list" placeholder="Предмет" value="'+esc(n.subject||subject)+'"><datalist id="subject-list">'+uniqueSubjects().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist><label>Текст конспекту</label><div class="toolbar"><button type="button" data-format="bold"><b>Ж</b></button><button type="button" data-format="italic"><i>К</i></button><button type="button" data-format="list">• Список</button><button type="button" data-format="number">1. Список</button></div><textarea class="field" name="body" placeholder="Пиши конспект тут...">'+esc(n.body||'')+'</textarea><label>Фото та файли (зберігаються локально, до 1 МБ на файл)</label><input class="field" type="file" id="attach" multiple accept="image/*,.pdf,.txt"><div class="files" id="attached">'+(n.files||[]).map(x=>esc(x.name)).join(', ')+'</div><label>Домашнє завдання</label><textarea class="field" style="min-height:85px" name="homework" placeholder="Що потрібно зробити?">'+esc(n.homework||'')+'</textarea><label>Приватність</label><select class="field" name="visibility"><option value="private">Лише я</option></select><button class="primary" type="submit">Зберегти конспект</button></form>'}let list=subject?a.filter(n=>n.subject===subject):a;return '<div class="row"><h2>'+(subject?esc(subject):'Предмети')+'</h2><button class="primary" data-new>＋ Новий</button></div>'+(subject?'<button class="back" data-subject="">← Усі предмети</button>':'')+(subject?(list.length?list.map((n)=>{let i=a.indexOf(n);return '<article class="item"><b>'+esc(n.title)+'</b><small>'+esc(n.updated||'')+'</small><p>'+esc(n.body||'').slice(0,160)+'</p><div class="row"><button class="secondary" data-edit="'+i+'">Відкрити</button><button class="danger" data-delete="'+i+'">Видалити</button></div></article>'}).join(''):'<div class="empty">Поки немає конспектів із цього предмета.</div>'):(uniqueSubjects().length?uniqueSubjects().map(s=>'<button class="item row" style="width:100%;color:inherit;text-align:left;border:1px solid #315b41" data-subject="'+esc(s)+'"><span><b>'+esc(s)+'</b><small>'+a.filter(n=>n.subject===s).length+' конспектів</small></span><span>›</span></button>').join(''):'<div class="empty">Предмети з’являться після завантаження розкладу. Можна створити конспект вручну.</div>'))+'<div class="card"><button class="secondary" data-all>Усі конспекти · '+a.length+'</button></div>'}
function renderJournal(){let a=journal().filter(n=>n.date===journalDate);return '<div class="card"><label>День</label><input type="date" class="field" id="journal-date" value="'+esc(journalDate)+'"><div class="row"><h2>Записи за день · '+a.length+'</h2><button class="primary" data-jnew>＋ Пара</button></div><p class="muted">Поки додавай заняття вручну. Автоматичне підключення до розкладу — наступний етап.</p></div>'+a.map(n=>'<article class="item"><b>'+esc(n.subject)+'</b><small>'+esc(n.attendance||'Не відмічено')+' · Оцінка: '+esc(n.grade||'—')+'</small><p>'+esc(n.comment||'')+'</p><button class="secondary" data-jedit="'+journal().indexOf(n)+'">Редагувати</button><button class="danger" data-jdelete="'+journal().indexOf(n)+'">Видалити</button></article>').join('')+(editingJournal!==-1?renderJournalForm():a.length?'':'<div class="empty">На цей день записів ще немає.</div>')}
function renderJournalForm(){let n=editingJournal>=0?journal()[editingJournal]:{};return '<div class="card"><h2>Запис про пару</h2><form id="journal-form"><input class="field" name="subject" required list="subject-list" placeholder="Предмет" value="'+esc(n.subject||'')+'"><datalist id="subject-list">'+uniqueSubjects().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist><select class="field" name="attendance"><option value="">Не відмічено</option>'+['Був','Запізнився','Не був'].map(x=>'<option '+(n.attendance===x?'selected':'')+'>'+x+'</option>').join('')+'</select><input class="field" name="grade" maxlength="20" placeholder="Оцінка" value="'+esc(n.grade||'')+'"><textarea class="field" name="comment" style="min-height:70px" placeholder="Нотатка">'+esc(n.comment||'')+'</textarea><button class="primary">Зберегти</button> <button class="secondary" type="button" data-jcancel>Скасувати</button></form></div>'}
function renderFriends(){return '<div class="card"><h2>Друзі</h2><p class="muted">Особистий код, заявки та список друзів потребують серверної авторизації Telegram. У цьому чистому тесті не показуємо несправжніх друзів і не імітуємо відправлення заявок.</p><span class="status">Серверне підключення — наступний етап</span></div>'}
function renderChats(){return '<div class="card"><h2>Чати групи '+group+'</h2><p class="muted">Для справжніх чатів потрібні авторизація Telegram, сервер і зберігання повідомлень. Поки цей розділ ізольований від старих скриптів.</p><span class="status">Серверне підключення — наступний етап</span></div>'}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;editor=-2;editingJournal=-1;render()}else if(b.hasAttribute('data-new')){editor=-1;render()}else if(b.hasAttribute('data-back')){editor=-2;render()}else if(b.hasAttribute('data-subject')){subject=b.dataset.subject;render()}else if(b.hasAttribute('data-all')){subject='';render()}else if(b.hasAttribute('data-edit')){editor=Number(b.dataset.edit);render()}else if(b.hasAttribute('data-delete')){let a=notes();if(confirm('Видалити конспект?')){a.splice(Number(b.dataset.delete),1);store('notes',a);render()}}else if(b.dataset.format){let t=$('[name=body]');if(!t)return;let p=t.selectionStart,q=t.selectionEnd,sel=t.value.slice(p,q),pre=b.dataset.format==='bold'?'**':b.dataset.format==='italic'?'*':b.dataset.format==='list'?'• ':'1. ',post=b.dataset.format==='bold'?'**':b.dataset.format==='italic'?'*':'';t.setRangeText(pre+sel+post,p,q,'select');t.focus()}else if(b.hasAttribute('data-jnew')){editingJournal=-2;render()}else if(b.hasAttribute('data-jedit')){editingJournal=Number(b.dataset.jedit);render()}else if(b.hasAttribute('data-jcancel')){editingJournal=-1;render()}else if(b.hasAttribute('data-jdelete')){let a=journal();if(confirm('Видалити запис?')){a.splice(Number(b.dataset.jdelete),1);store('journal',a);render()}}});
document.addEventListener('change',e=>{if(e.target.id==='journal-date'){journalDate=e.target.value;editingJournal=-1;render()}if(e.target.id==='attach'){let box=$('#attached');box.textContent=Array.from(e.target.files).map(f=>f.name).join(', ')}});document.addEventListener('submit',async e=>{if(e.target.id==='note-form'){e.preventDefault();let f=e.target,a=notes(),files=[];let selected=Array.from($('#attach').files);if(selected.some(x=>x.size>1024*1024)){alert('Кожен файл має бути до 1 МБ');return}try{files=await Promise.all(selected.map(file=>new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:reader.result});reader.onerror=reject;reader.readAsDataURL(file)})))}catch{alert('Не вдалося прочитати файли');return}let old=editor>=0?a[editor]:{},n={title:f.title.value.trim(),subject:f.subject.value.trim(),body:f.body.value,homework:f.homework.value,visibility:'private',files:[...(old.files||[]),...files],updated:new Date().toLocaleDateString('uk-UA')};if(!n.title||!n.subject)return;if(editor>=0)a[editor]=n;else a.unshift(n);if(!store('notes',a)){alert('Недостатньо пам’яті для збереження');return}editor=-2;subject=n.subject;render()}if(e.target.id==='journal-form'){e.preventDefault();let f=e.target,a=journal(),n={date:journalDate,subject:f.subject.value.trim(),attendance:f.attendance.value,grade:f.grade.value,comment:f.comment.value};if(!n.subject)return;if(editingJournal>=0)a[editingJournal]=n;else a.push(n);if(store('journal',a)){editingJournal=-1;render()}else alert('Не вдалося зберегти')}});render();})();
</script></body></html>
