const grades=journal.map(x=>Number(x.grade)).filter(x=>Number.isFinite(x)&&x>0),avg=grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(1):'—';
const monthStart=new Date(day+'T12:00:00');monthStart.setDate(1);const year=monthStart.getFullYear(),month=monthStart.getMonth();const first=(monthStart.getDay()+6)%7;const days=new Date(year,month+1,0).getDate();const monthLabel=monthStart.toLocaleDateString('uk-UA',{month:'long',year:'numeric'});const pad=n=>String(n).padStart(2,'0');const iso=d=>year+'-'+pad(month+1)+'-'+pad(d);
const calendar='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0"><button class="btn ghost tiny" id="prevMonth">←</button><b>'+escape(monthLabel)+'</b><button class="btn ghost tiny" id="nextMonth">→</button></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12px">'+['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(n=>'<b class="muted">'+n+'</b>').join('')+Array(first).fill('<span></span>').join('')+Array.from({length:days},(_,i)=>{const d=iso(i+1),has=timetable.some(x=>x.date===d),marked=journal.some(x=>x.date===d);return '<button data-day="'+d+'" style="border:1px solid '+(day===d?'#c8a85b':'#38584c')+';border-radius:10px;padding:8px 0;background:'+(day===d?'#254c3d':'transparent')+';color:inherit;position:relative">'+(i+1)+(marked?' ✓':has?' ·':'')+'</button>'}).join('')+'</div>';
const subjects=[...new Set([...timetable.map(x=>x.subject),...journal.map(x=>x.subject)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'uk'));
const subjectStats=subjects.map(subject=>{const items=journal.filter(x=>x.subject===subject),g=items.map(x=>Number(x.grade)).filter(n=>n>0&&Number.isFinite(n)),avg=g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(1):'—',present=items.filter(x=>x.attendance==='Був').length,absent=items.filter(x=>x.attendance==='Не був').length,late=items.filter(x=>x.attendance==='Запізнився').length,excused=items.filter(x=>x.attendance==='Поважна причина').length,denom=present+absent+late+excused,rate=denom?Math.round(100*(present+late)/denom)+'%':'—';return '<div class="card"><b>'+escape(subject)+'</b><div class="muted">Відвідування: '+rate+' · Був: '+present+' · Пропусків: '+absent+' · Запізнень: '+late+' · Поважні: '+excused+' · Середня оцінка: '+avg+'</div></div>'}).join('');

$('#view').innerHTML='<div class="row"><div><h1 class="heading">Журнал</h1><div class="muted">ЕІ-23-1 · заняття з розкладу</div></div><button class="btn" id="newLesson">+ Пара</button></div><input type="date" id="journalDate" class="field" value="'+escape(day)+'"><div class="chips"><span class="chip">Був: '+attended+'</span><span class="chip">Пропуски: '+missed+'</span><span class="chip">Запізнення: '+late+'</span><span class="chip">Середня оцінка: '+avg+'</span></div><p class="muted">Знайдено пар за дату: '+scheduled.length+'. '+(scheduleError?'Помилка завантаження: '+escape(scheduleError):'Джерело: schedule.json') +'</p>'+calendar+(scheduleCards+manualCards||'<div class="empty"><b>Немає пар на цю дату</b>Перевір дату або додай пару вручну.</div>')+'<div class="note-utility"><button class="btn ghost tiny" id="exportJournal">Експорт CSV</button><button class="btn ghost tiny" id="backupData">Копія JSON</button><label class="btn ghost tiny" style="cursor:pointer">Відновити JSON<input id="restoreData" type="file" accept="application/json,.json" style="display:none"></label></div><h2 style="font-size:17px;margin-top:24px">Статистика за предметами</h2>'+subjectStats+'<p class="warn">Розклад береться з GitHub, а відмітки зберігаються локально.</p>';
function downloadFile(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('#exportJournal').onclick=()=>{const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';downloadFile('depara-journal.csv','\uFEFF'+[['Дата','Предмет','Відвідування','Оцінка','Коментар'],...journal.map(x=>[x.date,x.subject,x.attendance,x.grade,x.comment])].map(r=>r.map(esc).join(';')).join('\n'),'text/csv;charset=utf-8')};$('#backupData').onclick=()=>downloadFile('depara-backup.json',JSON.stringify({version:1,notes,journal},null,2),'application/json');$('#restoreData').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.notes)||!Array.isArray(obj.journal))throw Error('Неправильний формат');if(!confirm('Замінити поточні конспекти та журнал даними з резервної копії?'))return;notes=obj.notes.filter(x=>x&&typeof x==='object');journal=obj.journal.filter(x=>x&&typeof x==='object');save();saveJournal();renderJournal()}catch(err){alert('Не вдалося відновити: '+err.message)}};$('#journalDate').onchange=e=>{day=e.target.value;renderJournal()};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;renderJournal()});$('#prevMonth').onclick=()=>{const d=new Date(day+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()-1);day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';renderJournal()};$('#nextMonth').onclick=()=>{const d=new Date(day+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+1);day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';renderJournal()};$('#newLesson').onclick=()=>editLesson(null);
document.querySelectorAll('[data-editlesson]').forEach(b=>b.onclick=()=>editLesson(b.dataset.editlesson));
document.querySelectorAll('[data-schedule]').forEach(b=>b.onclick=()=>{const [d,subject]=b.dataset.schedule.split('|');const existing=journal.find(x=>x.date===d&&x.subject===subject);editLesson(existing?existing.id:null,{date:d,subject})});
}
function editLesson(id,prefill){const existing=journal.find(x=>x.id===id)||{date:prefill?.date||day,subject:prefill?.subject||'',attendance:'',grade:'',comment:''};$('#view').innerHTML='<button class="back" id="journalBack">← Журнал</button><h1 class="heading">'+(id?'Редагувати пару':'Нова пара')+'</h1><form id="lessonForm"><label class="label">Дата</label><input class="field" type="date" name="date" required value="'+escape(existing.date)+'"><label class="label">Предмет</label><input class="field" name="subject" required placeholder="Назва предмета" value="'+escape(existing.subject)+'"><label class="label">Відвідування</label><select class="field" name="attendance">'+['','Був','Не був','Запізнився','Поважна причина'].map(v=>'<option value="'+escape(v)+'" '+(existing.attendance===v?'selected':'')+'>'+(v||'Не вибрано')+'</option>').join('')+'</select><label class="label">Оцінка (за бажанням)</label><input class="field" name="grade" type="number" min="0" max="100" step="0.1" value="'+escape(existing.grade)+'"><label class="label">Нотатка</label><textarea class="field" name="comment" style="min-height:100px" placeholder="Коментар до пари">'+escape(existing.comment)+'</textarea><button class="btn" type="submit">Зберегти пару</button></form>'+(id?'<button class="btn tiny" style="background:#66332e;color:white;margin-top:15px" id="removeLesson">Видалити запис</button>':'');
$('#journalBack').onclick=renderJournal;$('#lessonForm').onsubmit=e=>{e.preventDefault();const data=new FormData(e.currentTarget),item={id:id||'j'+Date.now(),date:String(data.get('date')),subject:String(data.get('subject')).trim(),attendance:String(data.get('attendance')),grade:String(data.get('grade')),comment:String(data.get('comment'))};if(!item.subject)return;const idx=journal.findIndex(x=>x.id===id);if(idx>=0)journal[idx]=item;else journal.push(item);if(saveJournal()){day=item.date;renderJournal()}};if(id)$('#removeLesson').onclick=()=>{if(confirm('Видалити запис про пару?')){journal=journal.filter(x=>x.id!==id);saveJournal();renderJournal()}}}
