name: Sync VNAU teachers

on:
  workflow_dispatch:
  schedule:
    # 05:17 / 18:17 Kyiv time; both UTC offsets cover DST.
    - cron: '17 2 * * *'
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
    - cron: '17 16 * * *'

permissions:
  contents: write

concurrency:
  group: sync-vnau-teachers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Kyiv scheduled time
        id: timecheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          event = os.environ['EVENT_NAME']
          if event == 'workflow_dispatch':
              should_run = True
          else:
              # Check the *scheduled* UTC hour, not delayed job start hour.
              scheduled_hour = int(os.environ['SCHEDULE'].split()[1])
              offset = dt.datetime.now(ZoneInfo('Europe/Kyiv')).utcoffset()
              kyiv_hour = (scheduled_hour + int(offset.total_seconds() // 3600)) % 24
              should_run = kyiv_hour in (5, 18)
              print(f"Scheduled UTC {scheduled_hour:02d}:17 => Kyiv {kyiv_hour:02d}:17; run={should_run}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run={'true' if should_run else 'false'}\n")
          PY
      - uses: actions/checkout@v4
        if: steps.timecheck.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.timecheck.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
        if: steps.timecheck.outputs.run == 'true'
      - run: python scripts/sync_teachers.py --batch 600 --delay 0.8
        if: steps.timecheck.outputs.run == 'true'
      - name: Commit results
        if: always() && steps.timecheck.outputs.run == 'true'
        run: |
          if [ -d data/teachers ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/teachers
            if ! git diff --cached --quiet; then
              git commit -m 'Update VNAU teacher catalog and schedules'
              git push
            fi
          fi
